name: CI
# The website has its own workflow (site.yml): a change that touches only
# the site doesn't need the app's checks.
on:
  pull_request:
    paths-ignore:
      - 'site/**'
      - 'netlify.toml'
      - '.github/workflows/site.yml'
  push:
    branches: [main]
    paths-ignore:
      - 'site/**'
      - 'netlify.toml'
      - '.github/workflows/site.yml'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Vérifications
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Tests
        run: npm test -- --ci

      - name: Textes légaux publiés
        run: npm run legal -- --check

      - name: Changelog
        run: npm run changelog
