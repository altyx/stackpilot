name: Mobile release

# Test on every merge to main, production on a `vX.Y.Z` tag. One file for
# both: the build number is `run_number`, which the stores require strictly
# increasing, and two workflows would mean two counters.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Préparation
    runs-on: ubuntu-latest
    outputs:
      track: ${{ steps.version.outputs.track }}
      tag: ${{ steps.version.outputs.tag }}
      create_tag: ${{ steps.version.outputs.create_tag }}
      build_number: ${{ steps.plan.outputs.build_number }}
      ios: ${{ steps.plan.outputs.ios }}
      android: ${{ steps.plan.outputs.android }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The previous commit is used to spot a version change, the tags to
          # refuse republishing a version that already shipped.
          fetch-depth: 2
          fetch-tags: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # docs/legal is the public version of the texts shown in the app, and
      # its URL is declared in the stores: the two must stay identical. The
      # script has no dependency, no need for `npm ci`.
      - name: Vérifier que les textes légaux publiés sont à jour
        run: npm run legal -- --check

      # The changelog is bundled in the binary: if it doesn't describe the
      # compiled version, that version's users will never see what's new, and
      # no later release will bring it to them.
      - name: Vérifier que le changelog décrit la version compilée
        run: npm run changelog

      # `expo.version` only moves in a release PR: seeing it change on `main`
      # therefore counts as the decision to publish, and the tag is set by the
      # `release` job, once the submissions succeed. Pushing a tag by hand is
      # still accepted, to resume an interrupted release.
      - name: Déterminer la destination
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(jq -r .expo.version app.json)
          track=beta
          create_tag=false

          if [ "$REF_TYPE" = tag ]; then
            # A `v1.0.0` tag must name an app whose `app.json` says `1.0.0`.
            # Checked here, before twenty minutes of build time: otherwise
            # Apple would reject the submission, or worse, accept it under a
            # version we didn't intend.
            if [ "$REF_NAME" != "v$version" ]; then
              echo "::error::Le tag $REF_NAME ne correspond pas à la version $version de app.json. Bumpez la version, fusionnez, puis retaguez."
              exit 1
            fi
            track=production
          else
            previous=$(git show HEAD~1:app.json 2>/dev/null | jq -r .expo.version || true)
            if [ -n "$previous" ] && [ "$previous" != "$version" ]; then
              # A version already tagged has already been submitted: the
              # stores would reject the duplicate, and the Release would
              # overwrite the existing one.
              if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
                echo "::error::Le tag v$version existe déjà : cette version est publiée. Bumpez à nouveau expo.version dans app.json."
                exit 1
              fi
              track=production
              create_tag=true
              echo "::notice::Version $previous → $version : publication en production."
            fi
          fi

          {
            echo "version=$version"
            echo "tag=v$version"
            echo "track=$track"
            echo "create_tag=$create_tag"
          } >> "$GITHUB_OUTPUT"

      # Test builds can ship with placeholder legal notices, a production
      # version can't: the terms of use shown must be complete.
      - name: Vérifier que les mentions légales sont complétées
        if: steps.version.outputs.track == 'production'
        run: |
          if grep -rn "À COMPLÉTER" src/legal; then
            echo "::error::Des champs « À COMPLÉTER » restent dans src/legal (voir les lignes ci-dessus). Complétez-les, fusionnez, puis retaguez."
            exit 1
          fi

      # Secrets aren't readable in a job's `if`: this job translates them into
      # outputs, and each platform is skipped while its own are missing,
      # without failing the workflow.
      - id: plan
        env:
          TRACK: ${{ steps.version.outputs.track }}
          BUILD_NUMBER: ${{ github.run_number }}
          HAS_IOS: ${{ secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.ASC_API_KEY_P8_BASE64 != '' && secrets.MATCH_PASSWORD != '' && secrets.MATCH_DEPLOY_KEY != '' }}
          HAS_ANDROID: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 != '' && secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD != '' && secrets.ANDROID_UPLOAD_KEY_ALIAS != '' && secrets.ANDROID_UPLOAD_KEY_PASSWORD != '' && secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        run: |
          {
            echo "track=$TRACK"
            echo "build_number=$BUILD_NUMBER"
            echo "ios=$HAS_IOS"
            echo "android=$HAS_ANDROID"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::Destination : $TRACK — build $BUILD_NUMBER"
          [ "$HAS_IOS" = true ] || echo "::warning::iOS ignoré : secrets Apple absents (voir docs/release.md)."
          [ "$HAS_ANDROID" = true ] || echo "::warning::Android ignoré : secrets Google Play absents (voir docs/release.md)."

  ios:
    # For iOS, test and production are the same submission to App Store
    # Connect: a build lands in TestFlight, and it's from the Apple console
    # that it gets submitted to the App Store. Only the build number
    # distinguishes submissions.
    name: iOS → App Store Connect
    needs: prepare
    if: needs.prepare.outputs.ios == 'true'
    runs-on: macos-26
    timeout-minutes: 90
    env:
      CI: 1
      BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
      # fastlane requires it: without a UTF-8 locale, it warns and can misread
      # xcodebuild's output.
      LC_ALL: en_US.UTF-8
      LANG: en_US.UTF-8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: ruby/setup-ruby@bec3f19a76460dbe12f60def7d1a77585f07516c # v1.322.0
        with:
          ruby-version: '4.0'
          bundler-cache: true

      - name: Générer le projet natif
        run: npx expo prebuild --platform ios --clean

      # match reads the certificates repo over SSH, with a read-only deploy
      # key. GitHub's host keys come from its API rather than an
      # `ssh-keyscan`, which would accept any server.
      - name: Préparer l'accès au dépôt des certificats
        env:
          GH_TOKEN: ${{ github.token }}
          MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          gh api meta --jq '.ssh_keys[] | "github.com " + .' >> ~/.ssh/known_hosts
          install -m 600 /dev/null "$RUNNER_TEMP/match_deploy_key"
          printf '%s\n' "$MATCH_DEPLOY_KEY" > "$RUNNER_TEMP/match_deploy_key"

      # Build and upload are two separate steps: the npm scripts the build
      # runs never see the App Store Connect key.
      - name: Signer et compiler
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_PRIVATE_KEY: ${{ runner.temp }}/match_deploy_key
        run: bundle exec fastlane ios build

      # TestFlight's "What to Test": testers read what the app will show in
      # Settings › What's new, not a list of commits.
      - name: Préparer les notes de version
        run: |
          {
            echo 'RELEASE_NOTES<<CHANGELOG_EOF'
            npm run --silent changelog -- --notes --max=4000
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_ENV"

      - name: Envoyer à App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: bundle exec fastlane ios upload

      - name: Journaux de compilation
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-logs-${{ needs.prepare.outputs.build_number }}
          path: build/ios/logs
          if-no-files-found: ignore

  android:
    name: Android → Google Play (${{ needs.prepare.outputs.track }})
    needs: prepare
    if: needs.prepare.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: 1
      BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Générer le projet natif
        run: npx expo prebuild --platform android --clean --no-install

      - name: Installer la clé d'envoi
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      # The properties are read by plugins/withAndroidReleaseSigning.js;
      # Gradle picks them up from the ORG_GRADLE_PROJECT_* variables.
      - name: Construire le bundle signé
        env:
          ORG_GRADLE_PROJECT_STACKPILOT_UPLOAD_STORE_FILE: ${{ runner.temp }}/upload.jks
          ORG_GRADLE_PROJECT_STACKPILOT_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_STACKPILOT_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_STACKPILOT_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: cd android && ./gradlew bundleRelease --no-daemon

      # Output forced to English: keytool follows the system language.
      - name: Vérifier la signature
        run: |
          cert=$(keytool -J-Duser.language=en -printcert -jarfile android/app/build/outputs/bundle/release/app-release.aab)
          if echo "$cert" | grep -q "CN=Android Debug"; then
            echo "::error::Le bundle est signé avec la clé de debug : la clé d'envoi n'a pas été prise en compte."
            exit 1
          fi
          echo "$cert" | grep -E "^Owner|SHA256:" | head -2 || true

      # Kept even if the upload fails: the very first submission to Google
      # Play must be done by hand from the console, with this file.
      - name: Conserver le bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-aab-${{ needs.prepare.outputs.build_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      # Test: internal track, published to testers. Production: uploaded as a
      # draft, to be launched from the console so nothing publishes without a
      # click. Google Play rejects more than 500 characters per language, and
      # only accepts languages declared on the store listing:
      # PLAY_NOTES_LANGUAGE must be one of them (see docs/release.md).
      - name: Préparer les notes de version
        env:
          PLAY_NOTES_LANGUAGE: fr-FR
        run: |
          mkdir -p distribution/whatsnew
          npm run --silent changelog -- --notes --max=500 \
            > "distribution/whatsnew/whatsnew-$PLAY_NOTES_LANGUAGE"

      - name: Envoyer à Google Play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.stackpilot
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          whatsNewDirectory: distribution/whatsnew
          track: ${{ needs.prepare.outputs.track == 'production' && 'production' || 'internal' }}
          status: ${{ needs.prepare.outputs.track == 'production' && 'draft' || 'completed' }}

  release:
    # One GitHub Release per tag, created only once submissions are done: it
    # attests to what actually shipped to the stores, not what we intended to
    # ship. `!cancelled()` lets it evaluate even if a platform was skipped.
    name: GitHub Release
    needs: [prepare, ios, android]
    if: ${{ !cancelled() && !failure() && needs.prepare.outputs.track == 'production' && (needs.ios.result == 'success' || needs.android.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Récupérer le bundle Android
        if: needs.android.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: android-aab-${{ needs.prepare.outputs.build_number }}
          path: dist

      - name: Créer la release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          CREATE_TAG: ${{ needs.prepare.outputs.create_tag }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
          IOS: ${{ needs.ios.result }}
          ANDROID: ${{ needs.android.result }}
        run: |
          notes=$(npm run --silent changelog -- --notes)
          notes="$notes"$'\n\n'"Build ${BUILD_NUMBER} · commit ${GITHUB_SHA::7}"
          notes="$notes"$'\n'"iOS : ${IOS} · Android : ${ANDROID}"
          assets=()
          [ -f dist/app-release.aab ] && assets+=("dist/app-release.aab#StackPilot-${TAG}-${BUILD_NUMBER}.aab")
          # The tag is created with the release, so only if the submissions
          # succeeded: nothing claims as published what didn't ship. Set with
          # GITHUB_TOKEN, it doesn't re-trigger this workflow.
          if [ "$CREATE_TAG" = true ]; then
            ref=(--target "$GITHUB_SHA")
          else
            ref=(--verify-tag)
          fi
          gh release create "$TAG" "${assets[@]}" "${ref[@]}" \
            --title "StackPilot ${TAG#v}" \
            --notes "$notes" \
            --generate-notes
