name: Mobile release

# Test sur chaque fusion dans main, production sur un tag `vX.Y.Z`. Un seul
# fichier pour les deux : le numéro de build est `run_number`, que les stores
# exigent strictement croissant, et deux workflows auraient deux compteurs.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Préparation
    runs-on: ubuntu-latest
    outputs:
      track: ${{ steps.version.outputs.track }}
      tag: ${{ steps.version.outputs.tag }}
      create_tag: ${{ steps.version.outputs.create_tag }}
      build_number: ${{ steps.plan.outputs.build_number }}
      ios: ${{ steps.plan.outputs.ios }}
      android: ${{ steps.plan.outputs.android }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Le commit précédent sert à repérer un changement de version, les
          # tags à refuser de republier une version déjà partie.
          fetch-depth: 2
          fetch-tags: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # docs/legal est la version publique des textes affichés dans l'app, et
      # son URL est déclarée dans les stores : les deux doivent rester
      # identiques. Le script n'a aucune dépendance, pas besoin de `npm ci`.
      - name: Vérifier que les textes légaux publiés sont à jour
        run: npm run legal -- --check

      # Le changelog est embarqué dans le binaire : s'il ne décrit pas la
      # version compilée, les utilisateurs de cette version ne verront jamais
      # ses nouveautés, et aucun envoi ultérieur ne les leur apportera.
      - name: Vérifier que le changelog décrit la version compilée
        run: npm run changelog

      # `expo.version` ne bouge que dans une PR de release : le voir changer sur
      # `main` vaut donc décision de publier, et le tag est posé par le job
      # `release`, une fois les envois réussis. Pousser un tag à la main reste
      # accepté, pour reprendre une publication interrompue.
      - name: Déterminer la destination
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(jq -r .expo.version app.json)
          track=beta
          create_tag=false

          if [ "$REF_TYPE" = tag ]; then
            # Un tag `v1.0.0` doit désigner une app dont `app.json` dit `1.0.0`.
            # Vérifié ici, avant vingt minutes de compilation : sinon Apple
            # refuserait l'envoi, ou pire, l'accepterait sous une version qu'on
            # ne voulait pas.
            if [ "$REF_NAME" != "v$version" ]; then
              echo "::error::Le tag $REF_NAME ne correspond pas à la version $version de app.json. Bumpez la version, fusionnez, puis retaguez."
              exit 1
            fi
            track=production
          else
            previous=$(git show HEAD~1:app.json 2>/dev/null | jq -r .expo.version || true)
            if [ -n "$previous" ] && [ "$previous" != "$version" ]; then
              # Une version déjà taguée a déjà été envoyée : les stores
              # refuseraient le doublon, et la Release écraserait l'existante.
              if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
                echo "::error::Le tag v$version existe déjà : cette version est publiée. Bumpez à nouveau expo.version dans app.json."
                exit 1
              fi
              track=production
              create_tag=true
              echo "::notice::Version $previous → $version : publication en production."
            fi
          fi

          {
            echo "version=$version"
            echo "tag=v$version"
            echo "track=$track"
            echo "create_tag=$create_tag"
          } >> "$GITHUB_OUTPUT"

      # Les builds de test peuvent partir avec des mentions légales provisoires,
      # pas une version de production : les CGU affichées doivent être complètes.
      - name: Vérifier que les mentions légales sont complétées
        if: steps.version.outputs.track == 'production'
        run: |
          if grep -rn "À COMPLÉTER" src/legal; then
            echo "::error::Des champs « À COMPLÉTER » restent dans src/legal (voir les lignes ci-dessus). Complétez-les, fusionnez, puis retaguez."
            exit 1
          fi

      # Les secrets ne sont pas lisibles dans un `if` de job : ce job les
      # traduit en sorties, et chaque plateforme est ignorée tant que les
      # siens manquent, sans faire échouer le workflow.
      - id: plan
        env:
          TRACK: ${{ steps.version.outputs.track }}
          BUILD_NUMBER: ${{ github.run_number }}
          HAS_IOS: ${{ secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.ASC_API_KEY_P8_BASE64 != '' && secrets.MATCH_PASSWORD != '' && secrets.MATCH_DEPLOY_KEY != '' }}
          HAS_ANDROID: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 != '' && secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD != '' && secrets.ANDROID_UPLOAD_KEY_ALIAS != '' && secrets.ANDROID_UPLOAD_KEY_PASSWORD != '' && secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        run: |
          {
            echo "track=$TRACK"
            echo "build_number=$BUILD_NUMBER"
            echo "ios=$HAS_IOS"
            echo "android=$HAS_ANDROID"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::Destination : $TRACK — build $BUILD_NUMBER"
          [ "$HAS_IOS" = true ] || echo "::warning::iOS ignoré : secrets Apple absents (voir docs/release.md)."
          [ "$HAS_ANDROID" = true ] || echo "::warning::Android ignoré : secrets Google Play absents (voir docs/release.md)."

  ios:
    # Pour iOS, test et production sont le même envoi vers App Store Connect :
    # un build y arrive dans TestFlight, et c'est depuis la console Apple qu'on
    # le soumet à l'App Store. Seul le numéro de build distingue les envois.
    name: iOS → App Store Connect
    needs: prepare
    if: needs.prepare.outputs.ios == 'true'
    runs-on: macos-26
    timeout-minutes: 90
    env:
      CI: 1
      BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
      # fastlane l'exige : sans locale UTF-8, il avertit et peut mal lire la
      # sortie de xcodebuild.
      LC_ALL: en_US.UTF-8
      LANG: en_US.UTF-8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: ruby/setup-ruby@bec3f19a76460dbe12f60def7d1a77585f07516c # v1.322.0
        with:
          ruby-version: '4.0'
          bundler-cache: true

      - name: Générer le projet natif
        run: npx expo prebuild --platform ios --clean

      # match lit le dépôt des certificats en SSH, avec une clé de déploiement
      # en lecture seule. Les clés d'hôte de GitHub viennent de son API plutôt
      # que d'un `ssh-keyscan`, qui accepterait n'importe quel serveur.
      - name: Préparer l'accès au dépôt des certificats
        env:
          GH_TOKEN: ${{ github.token }}
          MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          gh api meta --jq '.ssh_keys[] | "github.com " + .' >> ~/.ssh/known_hosts
          install -m 600 /dev/null "$RUNNER_TEMP/match_deploy_key"
          printf '%s\n' "$MATCH_DEPLOY_KEY" > "$RUNNER_TEMP/match_deploy_key"

      # Compilation et envoi sont deux étapes distinctes : les scripts npm que
      # la compilation exécute ne voient jamais la clé App Store Connect.
      - name: Signer et compiler
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_PRIVATE_KEY: ${{ runner.temp }}/match_deploy_key
        run: bundle exec fastlane ios build

      # « What to Test » de TestFlight : les testeurs lisent ce que l'app
      # affichera dans Réglages › Nouveautés, pas une liste de commits.
      - name: Préparer les notes de version
        run: |
          {
            echo 'RELEASE_NOTES<<CHANGELOG_EOF'
            npm run --silent changelog -- --notes --max=4000
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_ENV"

      - name: Envoyer à App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: bundle exec fastlane ios upload

      - name: Journaux de compilation
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-logs-${{ needs.prepare.outputs.build_number }}
          path: build/ios/logs
          if-no-files-found: ignore

  android:
    name: Android → Google Play (${{ needs.prepare.outputs.track }})
    needs: prepare
    if: needs.prepare.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: 1
      BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Générer le projet natif
        run: npx expo prebuild --platform android --clean --no-install

      - name: Installer la clé d'envoi
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      # Les propriétés sont lues par plugins/withAndroidReleaseSigning.js ;
      # Gradle les prend depuis les variables ORG_GRADLE_PROJECT_*.
      - name: Construire le bundle signé
        env:
          ORG_GRADLE_PROJECT_STACKPILOT_UPLOAD_STORE_FILE: ${{ runner.temp }}/upload.jks
          ORG_GRADLE_PROJECT_STACKPILOT_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_STACKPILOT_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_STACKPILOT_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: cd android && ./gradlew bundleRelease --no-daemon

      # Sortie forcée en anglais : keytool suit la langue du système.
      - name: Vérifier la signature
        run: |
          cert=$(keytool -J-Duser.language=en -printcert -jarfile android/app/build/outputs/bundle/release/app-release.aab)
          if echo "$cert" | grep -q "CN=Android Debug"; then
            echo "::error::Le bundle est signé avec la clé de debug : la clé d'envoi n'a pas été prise en compte."
            exit 1
          fi
          echo "$cert" | grep -E "^Owner|SHA256:" | head -2 || true

      # Conservé même si l'envoi échoue : le tout premier envoi vers Google
      # Play doit se faire à la main depuis la console, avec ce fichier.
      - name: Conserver le bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-aab-${{ needs.prepare.outputs.build_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      # Test : piste interne, publiée aux testeurs. Production : déposé en
      # brouillon, à lancer depuis la console pour ne rien publier sans un clic.
      # Google Play refuse au-delà de 500 caractères par langue, et n'accepte
      # que les langues déclarées sur la fiche du store : PLAY_NOTES_LANGUAGE
      # doit en être une (voir docs/release.md).
      - name: Préparer les notes de version
        env:
          PLAY_NOTES_LANGUAGE: fr-FR
        run: |
          mkdir -p distribution/whatsnew
          npm run --silent changelog -- --notes --max=500 \
            > "distribution/whatsnew/whatsnew-$PLAY_NOTES_LANGUAGE"

      - name: Envoyer à Google Play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.stackpilot
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          whatsNewDirectory: distribution/whatsnew
          track: ${{ needs.prepare.outputs.track == 'production' && 'production' || 'internal' }}
          status: ${{ needs.prepare.outputs.track == 'production' && 'draft' || 'completed' }}

  release:
    # Une GitHub Release par tag, créée seulement une fois les envois faits :
    # elle atteste ce qui est parti aux stores, pas ce qu'on comptait envoyer.
    # `!cancelled()` la laisse s'évaluer même si une plateforme a été ignorée.
    name: GitHub Release
    needs: [prepare, ios, android]
    if: ${{ !cancelled() && !failure() && needs.prepare.outputs.track == 'production' && (needs.ios.result == 'success' || needs.android.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Récupérer le bundle Android
        if: needs.android.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: android-aab-${{ needs.prepare.outputs.build_number }}
          path: dist

      - name: Créer la release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          CREATE_TAG: ${{ needs.prepare.outputs.create_tag }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
          IOS: ${{ needs.ios.result }}
          ANDROID: ${{ needs.android.result }}
        run: |
          notes=$(npm run --silent changelog -- --notes)
          notes="$notes"$'\n\n'"Build ${BUILD_NUMBER} · commit ${GITHUB_SHA::7}"
          notes="$notes"$'\n'"iOS : ${IOS} · Android : ${ANDROID}"
          assets=()
          [ -f dist/app-release.aab ] && assets+=("dist/app-release.aab#StackPilot-${TAG}-${BUILD_NUMBER}.aab")
          # Le tag naît avec la release, donc seulement si les envois ont
          # réussi : rien ne prétend publié ce qui n'est pas parti. Posé avec
          # GITHUB_TOKEN, il ne redéclenche pas ce workflow.
          if [ "$CREATE_TAG" = true ]; then
            ref=(--target "$GITHUB_SHA")
          else
            ref=(--verify-tag)
          fi
          gh release create "$TAG" "${assets[@]}" "${ref[@]}" \
            --title "StackPilot ${TAG#v}" \
            --notes "$notes" \
            --generate-notes
