# stackpilot.app — the website in site/, a static Astro build.
[build]
  base = "site"
  command = "npm run build"
  publish = "dist"
  # Rebuild only when something the site reads changed: its own sources, the
  # legal texts generated from the app, the screenshots or the app icon. The
  # free plan counts build minutes, and most commits only touch the app.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../netlify.toml ../docs/legal ../docs/screenshot ../assets"

[build.environment]
  NODE_VERSION = "24"
  ASTRO_TELEMETRY_DISABLED = "1"
